<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="jt-title jt-desc">
<title id="jt-title">Zones d’intervention JC TOITURES : Val-d’Oise (95)</title>
<desc id="jt-desc">Carte stylisée du département du Val-d’Oise avec les principales communes d’intervention de JC TOITURES autour de Jouy-le-Moutier.</desc>
<rect width="1000" height="680" rx="28" fill="#1c1917"/>
